name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest, base SQLite isolée)
        run: pytest -v

  ai-service-and-dashboard:
    name: ai_service & dashboard — vérification syntaxique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pas d'installation complète de torch/ultralytics/easyocr en CI
      # (plusieurs Go, plusieurs minutes) : on se limite à une vérification
      # syntaxique (py_compile) + lint ruff, qui ne nécessitent pas les
      # dépendances installées. Les tests fonctionnels de ces modules sont
      # couverts manuellement via les vidéos de test (voir README).
      - name: Installer ruff
        run: pip install ruff==0.6.9

      - name: Compiler ai_service (vérification syntaxique)
        run: python -m py_compile ai_service/*.py

      - name: Compiler dashboard (vérification syntaxique)
        run: python -m py_compile dashboard/*.py

      - name: Lint ai_service + dashboard (ruff)
        run: ruff check ai_service dashboard
